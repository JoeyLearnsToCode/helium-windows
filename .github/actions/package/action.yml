name: Package Windows release
description: Finish the build, create and upload packages
inputs:
  from_artifact:
    description: Restore the build tree from a previous job
    default: true
  arch:
    description: Target architecture (x86_64)
    required: true
outputs:
  version:
    description: Version of the packaged release
    value: ${{ steps.stage3.outputs.version }}
runs:
  using: composite
  steps:
    - name: Run Stage
      id: stage
      uses: ./.github/actions/stage
      with:
        arm: false
        from_artifact: ${{ inputs.from_artifact }}
        save_artifact: false

    - name: Check build completed
      if: steps.stage.outputs.finished != 'true'
      shell: pwsh
      run: throw 'Build did not finish within the available stages'

    - name: Package release
      id: release
      shell: pwsh
      working-directory: C:\helium-windows
      env:
        TARGET_ARCH: x64
      run: |
        python -m pip install pywin32==311
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python signing.py --arch $env:TARGET_ARCH

    - name: Upload artifacts
      id: stage3
      uses: ./.github/actions/stage
      with:
        upload_final: true
        final_directory: ${{ steps.release.outputs.artifacts }}
        arm: false
        from_artifact: false
